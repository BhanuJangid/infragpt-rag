services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://infragpt:infragpt@db:5432/infragpt
    depends_on:
      - db
    volumes:
      - ./backend/data:/app/data

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: infragpt
      POSTGRES_PASSWORD: infragpt
      POSTGRES_DB: infragpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/data/init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./frontend:/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
